<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

    :root {

      --accent-color: #8c533e;
      --bg-color: #fdf8f5;
      --card-bg: #ffffff;
      --text-color: #2c1d11;
      --border-radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 650px;
      width: 100%;
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      color: var(--primary-color);
      text-align: center;
      margin-top: 0;
      font-size: 1.8rem;
    }

    .input-group {
      background-color: #f4ece6;
      padding: 18px;
      border-radius: var(--border-radius);
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--primary-color);
    }

      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      border: 2px solid var(--accent-color);
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
    }

      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
